
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corelife"
version = "1.0.0"
description = "CoreLife backend (Flask) on Cloudflare Python Workers"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "requests",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
